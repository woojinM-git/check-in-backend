name: Deploy Backend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: SSH 설정
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{secrets.PRIVATE_KEY}}

    - name: .env 파일 생성
      run: |
        cat > .env << 'EOF'
# 환경변수 설정 파일
DB_URL=${{secrets.DB_URL}}
DB_USERNAME=${{secrets.DB_USERNAME}}
DB_PASSWORD=${{secrets.DB_PASSWORD}}
JWT_SECRET=${{secrets.JWT_SECRET}}
TOSS_SECRET_KEY=${{secrets.TOSS_SECRET_KEY}}
TOSS_CLIENT_KEY=${{secrets.TOSS_CLIENT_KEY}}
GMAIL_USERNAME=${{secrets.GMAIL_USERNAME}}
GMAIL_APP_PASSWORD=${{secrets.GMAIL_APP_PASSWORD}}
NEXT_PUBLIC_API_URL=${{secrets.NEXT_PUBLIC_API_URL}}
AWS_S3_ACCESS_KEY=${{secrets.AWS_S3_ACCESS_KEY}}
AWS_S3_SECRET_ACCESS_KEY=${{secrets.AWS_S3_SECRET_ACCESS_KEY}}
AWS_S3_BUCKET_NAME=${{secrets.AWS_S3_BUCKET_NAME}}
AWS_S3_REGION=${{secrets.AWS_S3_REGION}}
EOF

    # ==========================================================
    # ⚡️ 로컬에서 빌드하여 EC2에서 빌드 시간 절약
    # ==========================================================
    - name: Build Backend
      run: |
        # Gradle 빌드 실행
        chmod +x gradlew
        ./gradlew clean build -x test --no-daemon
        
        echo "✅ 빌드 완료"
        
    # ==========================================================
    # ⚡️ 속도 개선: tar로 압축하여 단일 파일로 전송
    # ==========================================================
    - name: Create Deployment Archive
      run: |
        # build/libs/ 확인
        ls -lh build/libs/
        
        # 필요한 파일만 압축 (JAR, 설정 파일)
        tar -czf deployment.tar.gz \
          Dockerfile \
          docker-compose.yml \
          .dockerignore \
          build/libs/*.jar \
          v1.sql \
          .env
        
        # 압축 내용 확인
        echo "✅ 압축 완료"
        tar -tzf deployment.tar.gz | head -20

    - name: Copy Archive to EC2
      run: |
        # EC2에 원격 디렉토리 생성
        ssh -o StrictHostKeyChecking=no ubuntu@${{secrets.HOST}} "mkdir -p /home/ubuntu/checkin_back"
        
        # tar 아카이브를 EC2로 전송
        scp -o StrictHostKeyChecking=no \
            deployment.tar.gz \
            ubuntu@${{secrets.HOST}}:/home/ubuntu/checkin_back/
            
    # ==========================================================
    # ⚡️ 속도 개선 2: EC2에서 압축 해제 및 Docker 실행
    # ==========================================================
    - name: Deploy and Start Application
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{secrets.HOST}} << 'EOF'
        
        DEPLOY_DIR="/home/ubuntu/checkin_back"
        
        # 1. 기존 컨테이너 정리 (volume 유지)
        cd "$DEPLOY_DIR"
        if [ -f docker-compose.yml ]; then
          # down만 실행 (--volumes 옵션 없음) = volume은 유지됨
          sudo docker-compose down || true
          
          # volume 존재 여부 확인
          if sudo docker volume ls | grep -q mysql_data; then
            echo "✅ MySQL data volume이 존재합니다. 데이터가 보존됩니다."
          else
            echo "ℹ️ MySQL data volume이 없습니다. 첫 배포입니다."
          fi
        fi
        
        # 2. tar 아카이브 압축 해제
        tar -xzf deployment.tar.gz
        
        # 압축 해제 확인
        echo "=== 압축 해제된 파일 확인 ==="
        ls -lh
        
        # .env 파일 존재 확인
        if [ -f .env ]; then
          echo "✅ .env 파일이 존재합니다"
          echo "파일 크기: $(stat -f%z .env) bytes"
        else
          echo "❌ .env 파일이 없습니다!"
          echo "현재 디렉토리 내용:"
          ls -la
          exit 1
        fi
        
        # 3. Docker권한 설정
        sudo chmod -R 777 "$DEPLOY_DIR"
        sudo chmod 777 /var/run/docker.sock
        
        # 4. 네트워크 존재여부 확인 및 생성
        if ! sudo docker network ls | grep -q checkin_net; then
          echo "checkin_net 네트워크를 생성합니다."
          sudo docker network create checkin_net
        fi
        
        # 5. Docker Compose로 서비스 시작
        sudo docker-compose up -d --build
        
        # 6. 헬스체크
        sleep 30
        curl -f http://localhost:8888 || exit 1
        
        EOF

