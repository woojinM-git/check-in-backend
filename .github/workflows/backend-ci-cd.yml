name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew clean test

      - name: Build backend jar
        run: ./gradlew bootJar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: packaged

      - name: Copy artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "packaged/*.jar"
          target: "${{ secrets.EC2_APP_DIR }}"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.EC2_APP_DIR }}
            LATEST_JAR=$(ls -t *.jar | head -n 1)
            if [ -z "$LATEST_JAR" ]; then
              echo "No jar found"; exit 1;
            fi
            mkdir -p releases && cp "$LATEST_JAR" "releases/$LATEST_JAR.$(date +%Y%m%d%H%M%S)"
            if systemctl is-enabled --quiet checkin-backend.service; then
              sudo systemctl stop checkin-backend.service
              sudo systemctl daemon-reload
              sudo systemctl start checkin-backend.service
              sudo systemctl status checkin-backend.service --no-pager
            else
              nohup java -jar "$LATEST_JAR" --spring.profiles.active=prod > app.log 2>&1 &
            fi

